AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  One IAM user: group memberships, optional console access with a generated
  first-login password in Secrets Manager, optional access key with its secret
  half in Secrets Manager. No credential ever passes through a parameter.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Identity
        Parameters:
          - NamePrefix
          - UserName
      - Label:
          default: Permissions
        Parameters:
          - Groups
          - ManagedPolicyArns
          - PermissionsBoundaryArn
      - Label:
          default: Credentials
        Parameters:
          - EnableConsoleAccess
          - CreateAccessKey

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the user name, normally the org or team name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  UserName:
    Type: String
    Description: >-
      The human's identifier, e.g. "alice". The IAM user becomes
      <NamePrefix>-<UserName>. One stack per user - deleting the stack
      offboards exactly one person.
    AllowedPattern: "^[a-z][a-z0-9._-]{0,40}[a-z0-9]$"

  Groups:
    Type: String
    Description: >-
      Comma-separated IAM group names this user joins - the outputs of a
      foundation/iam-groups stack, e.g. "example-org-powerusers". Groups are
      where permissions should come from; leave ManagedPolicyArns empty unless
      this user genuinely needs something no group grants.
    Default: ""

  ManagedPolicyArns:
    Type: String
    Description: >-
      Comma-separated managed policy ARNs attached directly to the user. The
      escape hatch, not the main path: per-user policies are what makes an
      account unauditable. Leave empty for none.
    Default: ""

  PermissionsBoundaryArn:
    Type: String
    Description: >-
      Optional permissions boundary capping everything the user's groups and
      policies grant. Leave empty for none.
    Default: ""

  EnableConsoleAccess:
    Type: String
    Description: >-
      Give the user a console password. It is generated by Secrets Manager,
      never appears in the template or the change set, and must be changed at
      first sign-in. Off by default: a user who only ever assumes roles or
      uses SSO needs no password at all.
    Default: "false"
    AllowedValues: ["true", "false"]

  CreateAccessKey:
    Type: String
    Description: >-
      Create a long-lived access key, stored in Secrets Manager. Off by
      default because long-lived keys are the credential that leaks: prefer
      roles (foundation/iam-role) or the CLI's SSO support. Turn on only for
      the tool that supports nothing else.
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  HasGroups: !Not [!Equals [!Ref Groups, ""]]
  HasManagedPolicies: !Not [!Equals [!Ref ManagedPolicyArns, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasConsoleAccess: !Equals [!Ref EnableConsoleAccess, "true"]
  HasAccessKey: !Equals [!Ref CreateAccessKey, "true"]

Resources:
  # The bootstrap password. Generated by Secrets Manager so it exists nowhere
  # else; PasswordResetRequired below makes it single-use, which is why this
  # secret is allowed to die with the stack instead of being retained.
  ConsolePasswordSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasConsoleAccess
    Properties:
      Name: !Sub "iam/${NamePrefix}-${UserName}/console-password"
      Description: !Sub >-
        First-login console password for IAM user ${NamePrefix}-${UserName}.
        Stale after their first sign-in forces a change.
      GenerateSecretString:
        PasswordLength: 32
        ExcludeCharacters: "\"@/\\'`$&;|<>()[]{}"
        RequireEachIncludedType: true

  User:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${NamePrefix}-${UserName}"
      Groups: !If [HasGroups, !Split [",", !Ref Groups], !Ref "AWS::NoValue"]
      ManagedPolicyArns: !If
        - HasManagedPolicies
        - !Split [",", !Ref ManagedPolicyArns]
        - !Ref AWS::NoValue
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      LoginProfile: !If
        - HasConsoleAccess
        - Password: !Sub "{{resolve:secretsmanager:${ConsolePasswordSecret}}}"
          # The generated password only bootstraps: the user must replace it
          # at first sign-in, so a copy read later from the secret is useless.
          PasswordResetRequired: true
        - !Ref AWS::NoValue

  AccessKey:
    Type: AWS::IAM::AccessKey
    Condition: HasAccessKey
    Properties:
      UserName: !Ref User

  # The only durable home of the secret half. GetAtt hands it to this resource
  # directly - it never transits a parameter, an output, or a change set. Not
  # retained: the key it describes is deleted with the stack, and a retained
  # copy of a dead credential is noise that reads like a live one.
  AccessKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasAccessKey
    Properties:
      Name: !Sub "iam/${NamePrefix}-${UserName}/access-key"
      Description: !Sub "Access key pair for IAM user ${NamePrefix}-${UserName}."
      SecretString: !Sub |-
        {"AccessKeyId": "${AccessKey}", "SecretAccessKey": "${AccessKey.SecretAccessKey}"}

Outputs:
  UserArn:
    Description: User ARN, for trust policies and resource policies.
    Value: !GetAtt User.Arn

  CreatedUserName:
    Description: The IAM user name, for the CLI and policy resource patterns.
    Value: !Ref User

  ConsoleSignInUrl:
    Description: Where to send the human on day one.
    Condition: HasConsoleAccess
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"

  ConsolePasswordSecretArn:
    Description: >-
      Secret holding the first-login password. Read it with
      `aws secretsmanager get-secret-value` and hand it over out of band.
    Condition: HasConsoleAccess
    Value: !Ref ConsolePasswordSecret

  AccessKeyId:
    Description: Access key ID (the public half), when a key was created.
    Condition: HasAccessKey
    Value: !Ref AccessKey

  AccessKeySecretArn:
    Description: Secret holding the access key pair, when a key was created.
    Condition: HasAccessKey
    Value: !Ref AccessKeySecret
