[pytest]
# Repo-wide sweeps live in tests/; per-template suites live beside the template
# they cover, so a template directory is self-contained (template + docs +
# example + tests) the way a Terraform module directory is.
testpaths = tests templates stacks
python_files = test_*.py
addopts = --strict-markers -ra
filterwarnings =
    error::DeprecationWarning
